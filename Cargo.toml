[package]
name = "ravel"
version = "0.3.0"
edition = "2024"

[dependencies]
rquickjs = { version = "0.11", features = ["futures", "macro", "loader"] }
rustyline = "14.0"
dirs = "5.0"
tokio = { version = "1", features = ["full"] }
oxc_allocator = "0.116"
oxc_parser = "0.116"
oxc_semantic = "0.116"
oxc_span = "0.116"
oxc_transformer = "0.116"
oxc_codegen = "0.116"

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["glob", "filters"] }
