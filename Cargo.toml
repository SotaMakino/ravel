[package]
name = "ravel"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "A toy JavaScript/TypeScript runtime written in Rust"

[dependencies]
rquickjs = { version = "0.11", features = ["futures", "macro", "loader"] }
rustyline = "14.0"
dirs = "5.0"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
oxc_allocator = "0.116"
oxc_parser = "0.116"
oxc_semantic = "0.116"
oxc_span = "0.116"
oxc_transformer = "0.116"
oxc_codegen = "0.116"
serde = { version = "1", features = ["derive"] }
# preserve_order because conditional exports are matched in the order the
# package.json declares them: "default" is a last resort, and the default
# BTreeMap would sort it first.
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["glob", "filters"] }
