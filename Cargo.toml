[package]
name = "ravel"
version = "0.3.0"
edition = "2024"

[dependencies]
rquickjs = { version = "0.11", features = ["futures", "macro", "loader"] }
rustyline = "14.0"
dirs = "5.0"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["glob", "filters"] }
