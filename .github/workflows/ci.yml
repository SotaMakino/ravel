name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # dtolnay/rust-toolchain stable
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      # swatinem/rust-cache v2
      - name: Rust Cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Build (locked)
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --verbose

  audit:
    runs-on: ubuntu-latest

    # audit-check publishes results as a check run; the default GITHUB_TOKEN
    # is read-only, which fails with "Resource not accessible by integration".
    permissions:
      contents: read
      checks: write

    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # swatinem/rust-cache v2
      - name: Rust Cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      # rustsec/audit-check master (node24)
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}